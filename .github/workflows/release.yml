name: VXKey macOS release (free public runner)
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vxkey_release_${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: SDK27
        run: node scripts/macos_sdk_gate.mjs --select-ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix desktop
      - name: Import VXKey signer (hosted runner only)
        env:
          VXKEY_MACOS_CERTIFICATE: ${{ secrets.VXKEY_MACOS_CERTIFICATE }}
          VXKEY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.VXKEY_MACOS_CERTIFICATE_PASSWORD }}
        run: python3 scripts/ci_macos_signer.py install
      - name: Build signed production app and helper
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: python3 scripts/build_release.py
      - name: Verify packages
        run: |
          python3 scripts/finalize_release.py
          node scripts/check_release_signature.mjs
      - name: Draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "VXKey ${GITHUB_REF_NAME#v}" --notes-file "docs/release_notes/${GITHUB_REF_NAME#v}.md" build/release_assets/*
      - name: Cleanup signer
        if: always()
        run: python3 scripts/ci_macos_signer.py cleanup
