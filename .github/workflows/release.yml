name: VXKey macOS release (free public runner)
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vxkey_release_${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: SDK27
        run: node scripts/macos_sdk_gate.mjs --select-ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix desktop
      - name: Import VXKey signer (hosted runner only)
        env:
          VXKEY_MACOS_CERTIFICATE: ${{ secrets.VXKEY_MACOS_CERTIFICATE }}
          VXKEY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.VXKEY_MACOS_CERTIFICATE_PASSWORD }}
        run: python3 scripts/ci_macos_signer.py install
      - name: Build signed production app and helper
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: GITHUB_REF_NAME="$RELEASE_TAG" python3 scripts/build_release.py
      - name: Verify packages
        run: |
          python3 scripts/finalize_release.py
          node scripts/check_release_signature.mjs
      - name: Draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "docs/release_notes/${RELEASE_TAG#v}.md" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "VXKey ${RELEASE_TAG#v}" --notes-file "docs/release_notes/${RELEASE_TAG#v}.md" build/release_assets/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "VXKey ${RELEASE_TAG#v}" --generate-notes build/release_assets/*
          fi
      - name: Cleanup signer
        if: always()
        run: python3 scripts/ci_macos_signer.py cleanup
