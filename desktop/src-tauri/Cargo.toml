[package]
name = "vxkey-desktop-backend"
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "vxkey_desktop_backend"
path = "src/lib.rs"

[[bin]]
name = "vxkey-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
vxkey-runtime = { path = "../../crates/vxkey-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }

tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
vxkey-windows-engine = { path = "../../platforms/windows_engine" }
funput-core = { path = "../../crates/funput-core" }
funput-engine = { path = "../../crates/funput-engine" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-registry = "=0.6.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
windows-production = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSSpellChecker", "NSApplication", "NSImage", "NSResponder", "NSFont", "NSParagraphStyle", "NSText", "NSAlert", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "NSAttributedString", "NSDictionary", "NSGeometry"] }
