[package]
name = "vxkey-desktop-backend"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "vxkey_desktop_backend"
path = "src/lib.rs"

[[bin]]
name = "vxkey-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
vxkey-runtime = { path = "../../crates/vxkey-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }

tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSSpellChecker", "NSApplication", "NSImage", "NSResponder", "NSFont", "NSParagraphStyle", "NSText", "NSAlert", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "NSAttributedString", "NSDictionary", "NSGeometry"] }
