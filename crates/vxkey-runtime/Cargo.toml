[package]
name = "vxkey-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
funput-core = { path = "../funput-core", features = ["charset", "textcase"] }
funput-engine = { path = "../funput-engine" }
funput-convert = { path = "../funput-convert" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
