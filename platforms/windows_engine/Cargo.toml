[package]
name = "vxkey-windows-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Deliberately isolated: the Mac workspace, lockfile and release graph are unchanged.
[workspace]

[dependencies]
funput-engine = { path = "../../crates/funput-engine" }
funput-core = { path = "../../crates/funput-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading",
    "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility",
    "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
